<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak-Tebakan Seru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🧠 Game Tebak-Tebakan</h1>
        
        <div id="quiz-box">
            <div id="question-number">Pertanyaan 1 dari 5</div>
            <div id="question-text">Pertanyaan akan muncul di sini...</div>
            
            <div id="options-container">
                <!-- Pilihan jawaban akan dimasukkan lewat JavaScript -->
            </div>

            <button id="next-btn" class="hidden" onclick="lanjutPertanyaan()">Selanjutnya</button>
        </div>

        <div id="result-box" class="hidden">
            <h2>Kuis Selesai! 🎉</h2>
            <p id="score-text">Skor kamu: 0</p>
            <button onclick="mulaiUlang()">Main Lagi</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
